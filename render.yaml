services:
  - type: web
    name: banco-de-recursos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: MAX_FILE_SIZE_MB
        value: 25
      - key: MAX_TOTAL_UPLOAD_MB
        value: 500
